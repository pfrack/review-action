name: 'NIM Code Review'
description: 'AI-powered code review using NVIDIA NIM models with fallback'
branding:
  icon: 'search'
  color: 'green'
inputs:
  nim_api_key:
    description: 'NVIDIA NIM API key'
    required: false
    default: ''
  nim_base_url:
    description: 'NIM API base URL'
    default: 'https://integrate.api.nvidia.com/v1'
  nim_models:
    description: 'Comma-separated fallback model chain'
    default: 'deepseek-ai/deepseek-v4-pro,deepseek-ai/deepseek-v4-flash,z-ai/glm-5.2,stepfun-ai/step-3.7-flash,mistralai/mistral-nemotron,openai/gpt-oss-120b,nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3-super-120b-a12b'
  mistral_api_key:
    description: 'Mistral API key (enables Mistral models in fallback chain)'
    default: ''
  mistral_base_url:
    description: 'Mistral API base URL'
    default: 'https://api.mistral.ai/v1'
  mistral_models:
    description: 'Comma-separated Mistral model fallback chain'
    default: 'mistral-medium-3.5,mistral-large-2512,mistral-small-2603,codestral-2508'
  groq_api_key:
    description: 'Groq API key (enables Groq models in fallback chain)'
    default: ''
  groq_base_url:
    description: 'Groq API base URL'
    default: 'https://api.groq.com/openai/v1'
  groq_models:
    description: 'Comma-separated Groq model fallback chain'
    default: 'openai/gpt-oss-120b,llama-3.3-70b-versatile'
  openrouter_api_key:
    description: 'OpenRouter API key'
    required: false
    default: ''
  openrouter_base_url:
    description: 'OpenRouter API base URL'
    default: 'https://openrouter.ai/api/v1'
  openrouter_models:
    description: 'Comma-separated OpenRouter model fallback chain (defaults to all free-tier models from provider when empty)'
    default: 'nvidia/nemotron-3.5-content-safety:free,nvidia/nemotron-3-nano-30b-a3b:free,inclusionai/ling-3.0-flash:free,nvidia/nemotron-nano-12b-v2-vl:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,nvidia/nemotron-3-ultra-550b-a55b:free,poolside/laguna-s-2.1:free,nvidia/nemotron-3-super-120b-a12b:free,cohere/north-mini-code:free,nvidia/nemotron-nano-9b-v2:free,openrouter/free,google/gemma-4-26b-a4b-it:free,poolside/laguna-xs-2.1:free,openai/gpt-oss-20b:free,poolside/laguna-m.1:free'
  openrouter_free_only:
    description: 'Filter OpenRouter models to only use free-tier (:free suffix) models'
    default: 'false'
  kilocode_api_key:
    description: 'Kilo Gateway API key'
    required: false
    default: ''
  kilocode_base_url:
    description: 'Kilo Gateway API base URL'
    default: 'https://api.kilo.ai/api/gateway'
  kilocode_models:
    description: 'Comma-separated Kilo model fallback chain (defaults to all free-tier models from provider when empty)'
    default: 'nvidia/nemotron-3.5-content-safety:free,inclusionai/ling-3.0-flash:free,kilo-auto/free,stepfun/step-3.7-flash:free,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free,openrouter/free,nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-super-120b-a12b:free,poolside/laguna-xs-2.1:free'
  kilocode_free_only:
    description: 'Filter Kilo models to only use free-tier (:free suffix) models'
    default: 'false'
  custom_models:
    description: 'Comma-separated custom model IDs for the custom API endpoint (multiple models enable fallback)'
    required: false
    default: ''
  custom_models_base_url:
    description: 'Base URL for custom_models (defaults to custom_api_url if not set)'
    default: ''
  custom_api_url:
    description: 'Custom OpenAI-compatible API base URL (tried before NIM models)'
    required: false
    default: ''
  custom_model:
    description: 'Model name for the custom API endpoint'
    required: false
    default: ''
  custom_api_key:
    description: 'API key for the custom endpoint (can be empty for local/keyless endpoints)'
    required: false
    default: ''
  max_files:
    description: 'Max files to review per PR'
    default: '100'
  exclude_patterns:
    description: 'Comma-separated glob patterns to skip'
    default: '*.lock,*.md,*.txt,*.svg,*.png,*.sum,*.json,*.yaml,*.yml,*.toml,*.mod,*.sum,.mimocode/*,go.sum,go.mod,dist/*'
  nim_system_prompt:
    description: 'Custom system prompt (appended to default or replaces it)'
    default: ''
  nim_prompt_mode:
    description: 'How to use custom prompt: append (default, appends after default) or replace (replaces default entirely)'
    default: 'append'
  custom_rules:
    description: 'Custom review rules (one per line, e.g., "Always check for SQL injection")'
    required: false
    default: ''
  revalidate_findings:
    description: 'Re-validate findings with LLM before posting (reduces false positives, adds latency)'
    required: false
    default: 'false'
runs:
  using: 'node24'
  main: 'dist/bundle/index.js'
