name: Daily Model Benchmark

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: benchmark-commit
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run benchmark
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NIM_BENCH_ITERATIONS: '1'
          REMOVED_MODELS_PATH: 'removed-models.txt'
        run: node dist/src/bench-entry.js > benchmark-output.txt

      - name: Show results
        if: always()
        run: cat benchmark-output.txt

      - name: Reorder models
        env:
          ACTION_PATH: action.yml
          ACTION_TARGET: nim_models
        run: |
          grep '^|' benchmark-output.txt > table.txt || true
          if [ -s table.txt ]; then
            node dist/src/bench-reorder.js < table.txt
          else
            echo "No benchmark table found, skipping reorder"
          fi

      - name: Commit updated model order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml
          if [ -f removed-models.txt ]; then git add removed-models.txt; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            LAST_MSG=$(git log -1 --format=%s)
            if echo "$LAST_MSG" | grep -q "chore: update model order from daily benchmark"; then
              git commit --amend --no-edit --date="$(date -R)"
              git checkout -- .
              git clean -fd
              git pull --rebase origin main
              git push --force
            else
              git commit -m "chore: update model order from daily benchmark [skip ci]"
              git checkout -- .
              git clean -fd
              git pull --rebase origin main
              git push
            fi
            LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
            if [ -n "$LATEST_TAG" ]; then
              echo "Moving tag $LATEST_TAG to current commit"
              git tag -f "$LATEST_TAG"
              git push origin "$LATEST_TAG" --force
            fi
          fi

