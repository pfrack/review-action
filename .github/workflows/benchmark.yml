  benchmark-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run OpenRouter benchmark
        env:
          BENCH_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BENCH_BASE_URL: 'https://openrouter.ai/api/v1'
          BENCH_AUTO_FREE: 'true'
          BENCH_ITERATIONS: '1'
          REMOVED_MODELS_PATH: 'removed-openrouter-models.txt'
          MODEL_HISTORY_PATH: 'openrouter-model-history.json'
          BENCH_SCORES_FILE: 'fetched-scores.json'
          ACTION_TARGET: openrouter_models
        run: node dist/src/bench-entry.js > benchmark-output.txt

      - name: Show results
        if: always()
        run: cat benchmark-output.txt

      - name: Discover new models
        run: |
          grep '^|' benchmark-output.txt | node dist/src/bench-reorder.js --discover-new > new-models.json || true
          cat new-models.json

      - name: Add new models to SWE-bench table
        run: |
          if [ -s new-models.json ] && [ "$(cat new-models.json)" != "[]" ]; then
            cat new-models.json | node dist/src/bench-reorder.js --patch-scores src/bench-reorder.ts
          else
            echo "No new models to add"
          fi

      - name: Reorder models (two-tier)
        env:
          ACTION_PATH: action.yml
          ACTION_TARGET: openrouter_models
          BENCH_SCORES_FILE: 'fetched-scores.json'
        run: |
          grep '^|' benchmark-output.txt > table.txt || true
          if [ -s table.txt ]; then
            node dist/src/bench-reorder.js --two-tier < table.txt
          else
            echo "No benchmark table found, skipping reorder"
          fi

      - name: Commit updated model order
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml src/bench-reorder.ts
          if [ -f removed-openrouter-models.txt ]; then git add removed-openrouter-models.txt; fi
          if [ -f openrouter-model-history.json ]; then git add openrouter-model-history.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update openrouter model order from daily benchmark [skip ci]"
            git checkout -- .
            git clean -fd
            if ! git pull --rebase origin main; then
              echo "Rebase conflict — aborting. Next run will pick up changes."
              git rebase --abort
              exit 0
            fi
            git push
          fi

