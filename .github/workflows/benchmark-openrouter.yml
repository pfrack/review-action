name: Daily Model Benchmark - OpenRouter

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  benchmark:
    uses: ./.github/workflows/benchmark-template.yml
    concurrency:
      group: benchmark-reorder
      cancel-in-progress: false
    secrets:
      BENCH_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      provider: openrouter
      action_target: openrouter_models
      base_url: 'https://openrouter.ai/api/v1'
      auto_free: true
      two_tier: true
      discover_new: true
      removed_path: removed-openrouter-models.txt
      history_path: openrouter-model-history.json
      scores_file: fetched-scores.json
