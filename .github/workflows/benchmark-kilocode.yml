name: Daily Model Benchmark - Kilocode

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: benchmark-commit
  cancel-in-progress: false

jobs:
  benchmark-kilocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Sync with origin/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:tsc

      - name: Run Kilo benchmark
        env:
          BENCH_API_KEY: ${{ secrets.KILO_API_KEY }}
          BENCH_BASE_URL: 'https://api.kilo.ai/api/gateway'
          BENCH_AUTO_FREE: 'true'
          BENCH_ITERATIONS: '1'
          REMOVED_MODELS_PATH: 'removed-kilocode-models.txt'
          MODEL_HISTORY_PATH: 'kilocode-model-history.json'
          BENCH_SCORES_FILE: 'fetched-scores.json'
          ACTION_TARGET: kilocode_models
        run: node dist/src/bench-entry.js > benchmark-output.txt

      - name: Show results
        if: always()
        run: cat benchmark-output.txt

      - name: Discover new models
        run: |
          grep '^|' benchmark-output.txt | node dist/src/bench-reorder.js --discover-new > new-models.json || true
          cat new-models.json

      - name: Add new models to SWE-bench table
        run: |
          if [ -s new-models.json ] && [ "$(cat new-models.json)" != "[]" ]; then
            cat new-models.json | node dist/src/bench-reorder.js --patch-scores src/bench-reorder.ts
          else
            echo "No new models to add"
          fi

      - name: Reorder models (two-tier)
        env:
          ACTION_PATH: action.yml
          ACTION_TARGET: kilocode_models
          BENCH_SCORES_FILE: 'fetched-scores.json'
        run: |
          grep '^|' benchmark-output.txt > table.txt || true
          if [ -s table.txt ]; then
            node dist/src/bench-reorder.js --two-tier < table.txt
          else
            echo "No benchmark table found, skipping reorder"
          fi

      - name: Commit updated model order
        if: github.ref == 'refs/heads/main'
        run: |
          git add action.yml src/bench-reorder.ts
          if [ -f removed-kilocode-models.txt ]; then git add removed-kilocode-models.txt; fi
          if [ -f kilocode-model-history.json ]; then git add kilocode-model-history.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            LAST_MSG=$(git log -1 --format=%s)
            AMEND_MSG="chore: update kilocode model order from daily benchmark"
            if echo "$LAST_MSG" | grep -q "$AMEND_MSG"; then
              git commit --amend --no-edit --date="$(date -R)"
              FORCE=1
            else
              git commit -m "$AMEND_MSG [skip ci]"
              FORCE=0
            fi
            git checkout -- .
            git clean -fd
            for i in 1 2 3; do
              if [ "$FORCE" = "1" ]; then
                git push --force-with-lease && break
              else
                git push && break
              fi
              echo "Push failed, syncing and retrying ($i)..."
              if ! git pull --rebase origin main; then
                echo "Rebase conflict — aborting. Next run will pick up changes."
                git rebase --abort
                exit 1
              fi
            done
          fi
